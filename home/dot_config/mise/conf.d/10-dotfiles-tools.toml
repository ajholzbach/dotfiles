# Recommended tools for `tools = true`, described in docs/tools.md. Update them
# with `mise upgrade` on Linux and `brew upgrade` on macOS.

# On Linux, mise installs the CLI tools because distribution packages can lag
[tools]
bat = { version = "latest", os = ["linux"] }
eza = { version = "latest", os = ["linux"] }
fzf = { version = "latest", os = ["linux"] }
zoxide = { version = "latest", os = ["linux"] }
# The go: backend needs go to build gopls
# Install go and gopls, the Go language server that Zed runs from PATH
go = { version = "latest", os = ["linux"] }
"go:golang.org/x/tools/gopls" = { version = "latest", os = ["linux"] }

# Fish 3 marks zoxide queries after cd as bad paths
# Add the fish 4 PPA, which mise adds only on Ubuntu and its derivatives
[bootstrap.apt.sources]
fish-shell-release-4 = { ppa = "fish-shell/release-4", fingerprint = "88421E703EDC7AF54967DED473C9FCC9E2BB48DA" }

# mise skips entries for package managers that this system does not have
[bootstrap.packages]
# On macOS, Homebrew also provides chezmoi, Starship, Antidote, and the font
"brew:antidote" = { version = "latest", os = "macos" }
"brew:bat" = { version = "latest", os = "macos" }
"brew:chezmoi" = { version = "latest", os = "macos" }
"brew:eza" = { version = "latest", os = "macos" }
"brew:fish" = { version = "latest", os = "macos" }
"brew:fzf" = { version = "latest", os = "macos" }
"brew:gopls" = { version = "latest", os = "macos" }
"brew:starship" = { version = "latest", os = "macos" }
"brew:zoxide" = { version = "latest", os = "macos" }
# A dotfiles-only install puts the same font files in ~/Library/Fonts
# Adopt those files when they match the cask
"brew-cask:font-meslo-lg-nerd-font" = { version = "latest", os = "macos", adopt = true }
"apt:fish" = "latest"
"apt:git" = "latest"
"apt:zsh" = "latest"
"pacman:fish" = "latest"
"pacman:git" = "latest"
"pacman:zsh" = "latest"
