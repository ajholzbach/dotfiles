set -ag terminal-features ",xterm-256color:RGB"
set -ag terminal-features ",xterm-ghostty:RGB"
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
# Without extended keys, Shift+Enter reaches programs as a plain Enter
# Pass modified keys such as Shift+Enter through to programs
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'
