name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The suites install the latest upstream releases, so run weekly to catch
  # upstream changes between pushes.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [minimal, ubuntu, arch, powershell, tools-ubuntu, tools-arch]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./tests/test.sh ${{ matrix.suite }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sh -c "$(curl --proto '=https' --tlsv1.2 -fsSL https://get.chezmoi.io/lb)"
      - run: PATH="$HOME/.local/bin:$PATH" ./tests/macos-test.sh
